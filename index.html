<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Organizador de Horários Escolares</title>
<link rel="stylesheet" href="styles.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Organizador de Horários Escolares</h1>
      <p>Arraste professores/disciplinas para a grade. Choques são bloqueados automaticamente.</p>
    </div>
    <div class="topbar-actions">
      <button id="btnAutoFill" class="btn btn-success">Preenchimento Automático</button>
      <button id="btnExportPdf" class="btn btn-primary">Baixar PDF</button>
      <button id="btnClearGrid" class="btn btn-danger">Limpar Grade</button>
    </div>
  </header>

  <main class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <section class="card">
        <h2>Professores</h2>
        <p class="hint">Arraste um item para a grade. Use o "x" para remover.</p>
        <div id="teachersList" class="teachers-list"></div>
      </section>

      <section class="card">
        <h2>Turma</h2>
        <div class="form-row">
          <label>Nome da Turma</label>
          <input type="text" id="className" placeholder="Ex.: 4° A" />
        </div>
        <div class="form-row">
          <label>Tipo</label>
          <select id="classType">
            <option value="regular">Regular (Manhã)</option>
            <option value="regular_tarde">Regular (Tarde)</option>
            <option value="integral">Integral (Manhã + Tarde)</option>
          </select>
        </div>
      </section>

      <section class="card">
        <h2>Cadastro de Professor</h2>
        <div class="form-row">
          <label>Nome do professor</label>
          <input type="text" id="teacherName" placeholder="Ex.: MARIANA" />
        </div>
        <div class="form-row">
          <label>Cor de identificação</label>
          <input type="color" id="teacherColor" value="#c6e0b4" />
        </div>
        <div class="form-row">
          <label>Disciplinas e quantidade de aulas</label>
          <div id="subjectsBuilder" class="subjects-builder"></div>
          <button type="button" id="btnAddSubjectRow" class="btn btn-ghost-dark btn-sm">+ Adicionar disciplina</button>
        </div>
        <div class="form-row btn-row">
          <button id="btnAddTeacher" class="btn btn-primary">Adicionar Professor</button>
        </div>
      </section>

      <section class="card">
        <h2>Cotas de Aulas</h2>
        <p class="hint">Atualizadas em tempo real conforme a grade é preenchida.</p>
        <div id="quotasList" class="quotas-list"></div>
      </section>
    </aside>

    <!-- Grid -->
    <section class="content">
      <div id="gridWrap" class="grid-wrap"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
