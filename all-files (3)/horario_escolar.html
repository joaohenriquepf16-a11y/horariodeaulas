<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Organizador de Horários Escolares</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root {
  --bg: #f4f6fb;
  --panel: #ffffff;
  --border: #d9dee7;
  --text: #1f2937;
  --muted: #6b7280;
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --danger: #dc2626;
  --success: #16a34a;
  --header-bg: #6ec06e;
  --intervalo: #f3f4f6;
  --intervalo-text: #374151;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 6px 24px rgba(0,0,0,.05);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg); color: var(--text);
}
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px;
  background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
  color: #fff; box-shadow: var(--shadow);
}
.topbar .brand h1 { margin: 0; font-size: 20px; }
.topbar .brand p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
.topbar-actions { display: flex; gap: 8px; }
.btn {
  border: 0; padding: 9px 14px; border-radius: 8px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: transform .05s ease, background .15s ease, box-shadow .15s ease;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #b91c1c; }
.layout {
  display: grid; grid-template-columns: 320px 1fr;
  gap: 18px; padding: 18px;
}
.sidebar { display: flex; flex-direction: column; gap: 14px; }
.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 14px 12px; box-shadow: var(--shadow);
}
.card h2 {
  margin: 0 0 10px; font-size: 14px; text-transform: uppercase;
  letter-spacing: .04em; color: #374151;
}
.form-row { display: flex; flex-direction: column; margin-bottom: 10px; }
.form-row label { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
.form-row input[type="text"], .form-row select {
  padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 14px; outline: none; background: #fff;
}
.form-row input[type="text"]:focus, .form-row select:focus {
  border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.15);
}
.form-row input[type="color"] {
  width: 56px; height: 34px; padding: 0; border: 1px solid var(--border);
  border-radius: 8px; background: #fff;
}
.btn-row { flex-direction: row; justify-content: flex-end; }
.hint { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
.teachers-list { display: flex; flex-direction: column; gap: 8px; max-height: 380px; overflow: auto; padding-right: 4px; }
.teacher-item {
  border: 1px solid var(--border); border-radius: 10px;
  padding: 8px 10px; background: #fff;
  display: flex; flex-direction: column; gap: 6px;
}
.teacher-head { display: flex; align-items: center; gap: 8px; }
.color-dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); flex: 0 0 auto; }
.teacher-name { font-weight: 700; font-size: 14px; flex: 1; }
.teacher-remove {
  background: transparent; border: 0; color: var(--danger);
  font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 6px; border-radius: 6px;
}
.teacher-remove:hover { background: #fee2e2; }
.subject-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
  cursor: grab; user-select: none; border: 1px solid rgba(0,0,0,.08);
  transition: transform .05s ease, box-shadow .15s ease;
}
.chip:hover { box-shadow: 0 2px 6px rgba(0,0,0,.15); }
.chip:active { cursor: grabbing; transform: scale(.97); }
.content { min-width: 0; }
.grid-wrap {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: var(--shadow); padding: 12px; overflow: auto;
}
table.schedule { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
table.schedule th, table.schedule td {
  border: 1px solid #9ca3af; padding: 6px 8px; text-align: center;
  vertical-align: middle; height: 44px;
}
table.schedule thead th { background: var(--header-bg); color: #1f2937; font-weight: 700; }
table.schedule td.meta { background: #eef2ff; font-weight: 700; }
table.schedule tr.interval td {
  background: var(--intervalo); color: var(--intervalo-text);
  font-weight: 700; letter-spacing: .05em;
}
.slot { cursor: pointer; min-height: 32px; transition: outline .1s ease; }
.slot.drag-over { outline: 3px dashed var(--primary); outline-offset: -3px; }
.slot.filled { font-weight: 700; }
.slot .remove-x { display: none; margin-left: 6px; color: rgba(0,0,0,.45); font-weight: 900; cursor: pointer; }
.slot.filled:hover .remove-x { display: inline; }
.toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #111827; color: #fff; padding: 10px 16px;
  border-radius: 8px; font-size: 13px; opacity: 0;
  pointer-events: none; transition: opacity .2s ease, transform .2s ease;
  z-index: 50; box-shadow: 0 6px 20px rgba(0,0,0,.25);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: #b91c1c; }
.toast.success { background: #15803d; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Organizador de Horários Escolares</h1>
      <p>Arraste professores/disciplinas para a grade. Choques são bloqueados automaticamente.</p>
    </div>
    <div class="topbar-actions">
      <button id="btnExportPdf" class="btn btn-primary">Baixar PDF</button>
      <button id="btnClearGrid" class="btn btn-danger">Limpar Grade</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="card">
        <h2>Turma</h2>
        <div class="form-row">
          <label>Nome da Turma</label>
          <input type="text" id="className" placeholder="Ex.: 4° A" />
        </div>
        <div class="form-row">
          <label>Tipo</label>
          <select id="classType">
            <option value="regular">Regular (Manhã)</option>
            <option value="regular_tarde">Regular (Tarde)</option>
            <option value="integral">Integral (Manhã + Tarde)</option>
          </select>
        </div>
      </section>

      <section class="card">
        <h2>Cadastro de Professor</h2>
        <div class="form-row">
          <label>Nome do professor</label>
          <input type="text" id="teacherName" placeholder="Ex.: MARIANA" />
        </div>
        <div class="form-row">
          <label>Cor de identificação</label>
          <input type="color" id="teacherColor" value="#c6e0b4" />
        </div>
        <div class="form-row">
          <label>Disciplinas (separe por vírgula)</label>
          <input type="text" id="teacherSubjects" placeholder="Ex.: POR, MAT, CIÊN" />
        </div>
        <div class="form-row btn-row">
          <button id="btnAddTeacher" class="btn btn-primary">Adicionar Professor</button>
        </div>
      </section>

      <section class="card">
        <h2>Professores</h2>
        <p class="hint">Arraste um item para a grade. Use o "x" para remover.</p>
        <div id="teachersList" class="teachers-list"></div>
      </section>
    </aside>

    <section class="content">
      <div id="gridWrap" class="grid-wrap"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
  const STORAGE_KEY = "school_schedule_v1";
  const DAYS = [
    { key: "seg", label: "Segunda-feira" },
    { key: "ter", label: "Terça-feira" },
    { key: "qua", label: "Quarta-feira" },
    { key: "qui", label: "Quinta-feira" },
    { key: "sex", label: "Sexta-feira" },
  ];
  const LAYOUTS = {
    regular: {
      rows: [
        { kind: "class", turno: "Manhã", aula: "1ª", id: "m1" },
        { kind: "class", turno: "Manhã", aula: "2ª", id: "m2" },
        { kind: "interval", label: "INTERVALO", fullSpan: false },
        { kind: "class", turno: "Manhã", aula: "3ª", id: "m3" },
        { kind: "class", turno: "Manhã", aula: "4ª", id: "m4" },
      ],
    },
    regular_tarde: {
      rows: [
        { kind: "class", turno: "Tarde", aula: "1ª", id: "t1" },
        { kind: "class", turno: "Tarde", aula: "2ª", id: "t2" },
        { kind: "interval", label: "INTERVALO", fullSpan: false },
        { kind: "class", turno: "Tarde", aula: "3ª", id: "t3" },
        { kind: "class", turno: "Tarde", aula: "4ª", id: "t4" },
      ],
    },
    integral: {
      rows: [
        { kind: "class", turno: "Manhã", aula: "1ª", id: "m1" },
        { kind: "class", turno: "Manhã", aula: "2ª", id: "m2" },
        { kind: "interval", label: "INTERVALO", fullSpan: false },
        { kind: "class", turno: "Manhã", aula: "3ª", id: "m3" },
        { kind: "class", turno: "Manhã", aula: "4ª", id: "m4" },
        { kind: "interval", label: "INTERVALO DO ALMOÇO", fullSpan: true },
        { kind: "class", turno: "Tarde", aula: "5ª", id: "t5" },
        { kind: "class", turno: "Tarde", aula: "6ª", id: "t6" },
        { kind: "interval", label: "INTERVALO", fullSpan: false },
        { kind: "class", turno: "Tarde", aula: "7ª", id: "t7" },
        { kind: "class", turno: "Tarde", aula: "8ª", id: "t8" },
      ],
    },
  };

  let state = {
    className: "",
    classType: "regular",
    teachers: [],
    schedule: {},
  };

  function uid() { return Math.random().toString(36).slice(2, 10); }
  function $(sel) { return document.querySelector(sel); }
  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) state = { ...state, ...JSON.parse(raw) };
    } catch (e) { console.warn("Falha ao carregar estado", e); }
  }
  function toast(msg, type = "") {
    const el = $("#toast");
    el.textContent = msg;
    el.className = "toast show " + type;
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { el.className = "toast"; }, 2200);
  }
  function textColorFor(hex) {
    const c = hex.replace("#", "");
    const r = parseInt(c.substring(0,2),16);
    const g = parseInt(c.substring(2,4),16);
    const b = parseInt(c.substring(4,6),16);
    const yiq = (r*299 + g*587 + b*114) / 1000;
    return yiq >= 140 ? "#111827" : "#ffffff";
  }
  function hexToRgb(hex) {
    const c = hex.replace("#", "");
    return {
      r: parseInt(c.substring(0,2),16),
      g: parseInt(c.substring(2,4),16),
      b: parseInt(c.substring(4,6),16),
    };
  }
  function slotKey(rowId, dayKey) { return `${rowId}|${dayKey}`; }

  function addTeacher(name, color, subjectsStr) {
    const subjects = subjectsStr.split(",").map(s => s.trim()).filter(Boolean);
    if (!name) { toast("Informe o nome do professor.", "error"); return; }
    if (subjects.length === 0) { toast("Informe ao menos uma disciplina.", "error"); return; }
    const dup = state.teachers.find(t => t.name.toLowerCase() === name.toLowerCase());
    if (dup) { toast("Já existe um professor com esse nome.", "error"); return; }
    state.teachers.push({ id: uid(), name: name.toUpperCase(), color, subjects: subjects.map(s => s.toUpperCase()) });
    save();
    renderTeachers();
    toast("Professor adicionado.", "success");
  }
  function removeTeacher(id) {
    const t = state.teachers.find(x => x.id === id);
    if (!t) return;
    if (!confirm(`Remover ${t.name}? Todos os horários dele(a) serão limpos.`)) return;
    state.teachers = state.teachers.filter(x => x.id !== id);
    for (const k of Object.keys(state.schedule)) {
      if (state.schedule[k].teacherId === id) delete state.schedule[k];
    }
    save();
    renderTeachers();
    renderGrid();
    toast("Professor removido.");
  }
  function renderTeachers() {
    const list = $("#teachersList");
    list.innerHTML = "";
    if (state.teachers.length === 0) {
      list.innerHTML = `<p class="hint">Nenhum professor cadastrado ainda.</p>`;
      return;
    }
    for (const t of state.teachers) {
      const el = document.createElement("div");
      el.className = "teacher-item";
      el.innerHTML = `
        <div class="teacher-head">
          <span class="color-dot" style="background:${t.color}"></span>
          <span class="teacher-name">${t.name}</span>
          <button class="teacher-remove" title="Remover professor" data-id="${t.id}">×</button>
        </div>
        <div class="subject-chips"></div>
      `;
      const chipsWrap = el.querySelector(".subject-chips");
      for (const subject of t.subjects) {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.draggable = true;
        chip.textContent = `${subject} - ${t.name}`;
        chip.style.background = t.color;
        chip.style.color = textColorFor(t.color);
        chip.dataset.teacherId = t.id;
        chip.dataset.subject = subject;
        chip.addEventListener("dragstart", (e) => {
          e.dataTransfer.setData("text/plain", JSON.stringify({ teacherId: t.id, subject }));
          e.dataTransfer.effectAllowed = "copyMove";
        });
        chipsWrap.appendChild(chip);
      }
      el.querySelector(".teacher-remove").addEventListener("click", () => removeTeacher(t.id));
      list.appendChild(el);
    }
  }

  function renderGrid() {
    const layout = LAYOUTS[state.classType];
    const wrap = $("#gridWrap");
    wrap.innerHTML = "";
    const table = document.createElement("table");
    table.className = "schedule";
    const thead = document.createElement("thead");
    const trh = document.createElement("tr");
    ["Turma", "Turno", "Aula", ...DAYS.map(d => d.label)].forEach(h => {
      const th = document.createElement("th");
      th.textContent = h;
      trh.appendChild(th);
    });
    thead.appendChild(trh);
    table.appendChild(thead);
    const tbody = document.createElement("tbody");
    const rows = layout.rows;
    const turmaSpan = new Array(rows.length).fill(0);
    const turnoSpan = new Array(rows.length).fill(0);
    let i = 0;
    while (i < rows.length) {
      if (rows[i].kind === "interval" && rows[i].fullSpan) { i++; continue; }
      let j = i;
      while (j < rows.length && !(rows[j].kind === "interval" && rows[j].fullSpan)) j++;
      let firstClassIdx = -1;
      for (let k = i; k < j; k++) { if (rows[k].kind === "class") { firstClassIdx = k; break; } }
      if (firstClassIdx !== -1) turmaSpan[firstClassIdx] = j - i;
      const seenTurnos = new Set();
      for (let k = i; k < j; k++) {
        if (rows[k].kind !== "class") continue;
        const t = rows[k].turno;
        if (seenTurnos.has(t)) continue;
        seenTurnos.add(t);
        let lastIdx = k;
        for (let m = k; m < j; m++) {
          if (rows[m].kind === "class" && rows[m].turno === t) lastIdx = m;
        }
        turnoSpan[k] = lastIdx - k + 1;
      }
      i = j;
    }
    for (let idx = 0; idx < rows.length; idx++) {
      const row = rows[idx];
      const tr = document.createElement("tr");
      if (row.kind === "interval") {
        const td = document.createElement("td");
        td.colSpan = row.fullSpan ? 8 : 6;
        td.textContent = row.label;
        tr.classList.add("interval");
        tr.appendChild(td);
        tbody.appendChild(tr);
        continue;
      }
      if (turmaSpan[idx] > 0) {
        const tdTurma = document.createElement("td");
        tdTurma.className = "meta";
        tdTurma.rowSpan = turmaSpan[idx];
        tdTurma.textContent = state.className || "—";
        tr.appendChild(tdTurma);
      }
      if (turnoSpan[idx] > 0) {
        const tdTurno = document.createElement("td");
        tdTurno.className = "meta";
        tdTurno.rowSpan = turnoSpan[idx];
        tdTurno.textContent = row.turno;
        tr.appendChild(tdTurno);
      }
      const tdAula = document.createElement("td");
      tdAula.className = "meta";
      tdAula.textContent = row.aula;
      tr.appendChild(tdAula);
      for (const day of DAYS) {
        const td = document.createElement("td");
        td.className = "slot";
        td.dataset.rowId = row.id;
        td.dataset.day = day.key;
        const key = slotKey(row.id, day.key);
        const entry = state.schedule[key];
        if (entry) {
          const t = state.teachers.find(x => x.id === entry.teacherId);
          if (t) {
            td.classList.add("filled");
            td.style.background = t.color;
            td.style.color = textColorFor(t.color);
            td.innerHTML = `${entry.subject} - ${t.name}<span class="remove-x" title="Remover">×</span>`;
            td.draggable = true;
            td.addEventListener("dragstart", (e) => {
              e.dataTransfer.setData("text/plain", JSON.stringify({
                teacherId: entry.teacherId, subject: entry.subject, fromKey: key
              }));
              e.dataTransfer.effectAllowed = "move";
            });
            td.querySelector(".remove-x").addEventListener("click", (ev) => {
              ev.stopPropagation();
              delete state.schedule[key];
              save(); renderGrid();
            });
          }
        }
        td.addEventListener("dragover", (e) => {
          e.preventDefault();
          td.classList.add("drag-over");
        });
        td.addEventListener("dragleave", () => td.classList.remove("drag-over"));
        td.addEventListener("drop", (e) => {
          e.preventDefault();
          td.classList.remove("drag-over");
          let payload;
          try { payload = JSON.parse(e.dataTransfer.getData("text/plain")); }
          catch { return; }
          handleDrop(row.id, day.key, payload);
        });
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    wrap.appendChild(table);
  }

  function handleDrop(rowId, dayKey, payload) {
    const targetKey = slotKey(rowId, dayKey);
    const existing = state.schedule[targetKey];
    if (payload.fromKey && payload.fromKey !== targetKey) {
      if (existing && existing.teacherId !== payload.teacherId) {
        toast("Choque de horário: este slot já tem outro professor.", "error");
        return;
      }
      delete state.schedule[payload.fromKey];
    } else if (existing && existing.teacherId !== payload.teacherId) {
      toast("Choque de horário: este slot já tem outro professor.", "error");
      return;
    }
    state.schedule[targetKey] = { teacherId: payload.teacherId, subject: payload.subject };
    save();
    renderGrid();
  }

  function exportPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: "landscape", unit: "pt", format: "a4" });
    const typeLabel = {
      regular: "Regular (Manhã)",
      regular_tarde: "Regular (Tarde)",
      integral: "Integral (Manhã + Tarde)",
    }[state.classType] || "Regular";
    const title = `Horário — ${state.className || "Turma"} (${typeLabel})`;
    doc.setFontSize(14);
    doc.text(title, 40, 36);
    const layout = LAYOUTS[state.classType];
    const head = [["Turma", "Turno", "Aula", ...DAYS.map(d => d.label)]];
    const body = [];
    const rowsL = layout.rows;
    const turmaSpanP = new Array(rowsL.length).fill(0);
    const turnoSpanP = new Array(rowsL.length).fill(0);
    {
      let i = 0;
      while (i < rowsL.length) {
        if (rowsL[i].kind === "interval" && rowsL[i].fullSpan) { i++; continue; }
        let j = i;
        while (j < rowsL.length && !(rowsL[j].kind === "interval" && rowsL[j].fullSpan)) j++;
        let firstClassIdx = -1;
        for (let k = i; k < j; k++) { if (rowsL[k].kind === "class") { firstClassIdx = k; break; } }
        if (firstClassIdx !== -1) turmaSpanP[firstClassIdx] = j - i;
        const seen = new Set();
        for (let k = i; k < j; k++) {
          if (rowsL[k].kind !== "class") continue;
          const t = rowsL[k].turno;
          if (seen.has(t)) continue;
          seen.add(t);
          let lastIdx = k;
          for (let m = k; m < j; m++) if (rowsL[m].kind === "class" && rowsL[m].turno === t) lastIdx = m;
          turnoSpanP[k] = lastIdx - k + 1;
        }
        i = j;
      }
    }
    for (let idx = 0; idx < rowsL.length; idx++) {
      const row = rowsL[idx];
      if (row.kind === "interval") {
        const colSpan = row.fullSpan ? 8 : 6;
        body.push([{ content: row.label, colSpan, styles: { halign: "center", fillColor: [243,244,246], fontStyle: "bold" } }]);
        continue;
      }
      const cells = [];
      if (turmaSpanP[idx] > 0) {
        cells.push({ content: state.className || "—", rowSpan: turmaSpanP[idx], styles: { valign: "middle", halign: "center", fillColor: [238,242,255], fontStyle: "bold" } });
      }
      if (turnoSpanP[idx] > 0) {
        cells.push({ content: row.turno, rowSpan: turnoSpanP[idx], styles: { valign: "middle", halign: "center", fillColor: [238,242,255], fontStyle: "bold" } });
      }
      cells.push({ content: row.aula, styles: { halign: "center", fillColor: [238,242,255], fontStyle: "bold" } });
      for (const day of DAYS) {
        const key = slotKey(row.id, day.key);
        const entry = state.schedule[key];
        if (entry) {
          const t = state.teachers.find(x => x.id === entry.teacherId);
          if (t) {
            const rgb = hexToRgb(t.color);
            const tc = textColorFor(t.color);
            cells.push({
              content: `${entry.subject} - ${t.name}`,
              styles: {
                fillColor: [rgb.r, rgb.g, rgb.b],
                textColor: tc === "#ffffff" ? [255,255,255] : [17,24,39],
                fontStyle: "bold",
                halign: "center"
              }
            });
            continue;
          }
        }
        cells.push({ content: "", styles: { halign: "center" } });
      }
      body.push(cells);
    }
    doc.autoTable({
      head, body, startY: 52, theme: "grid",
      styles: { fontSize: 9, cellPadding: 4, lineColor: [156,163,175], lineWidth: 0.5 },
      headStyles: { fillColor: [110,192,110], textColor: [31,41,55], fontStyle: "bold", halign: "center" },
      columnStyles: { 0: { cellWidth: 60 }, 1: { cellWidth: 55 }, 2: { cellWidth: 40 } },
    });
    const filename = `horario_${(state.className || "turma").replace(/\s+/g,"_")}.pdf`;
    doc.save(filename);
  }

  function bindUI() {
    $("#className").addEventListener("input", (e) => {
      state.className = e.target.value; save(); renderGrid();
    });
    $("#classType").addEventListener("change", (e) => {
      state.classType = e.target.value; save(); renderGrid();
    });
    $("#btnAddTeacher").addEventListener("click", () => {
      const name = $("#teacherName").value.trim();
      const color = $("#teacherColor").value;
      const subjects = $("#teacherSubjects").value.trim();
      addTeacher(name, color, subjects);
      $("#teacherName").value = "";
      $("#teacherSubjects").value = "";
    });
    $("#btnClearGrid").addEventListener("click", () => {
      if (!confirm("Limpar todos os horários da grade?")) return;
      state.schedule = {}; save(); renderGrid();
      toast("Grade limpa.");
    });
    $("#btnExportPdf").addEventListener("click", exportPDF);
  }

  function seedIfEmpty() {
    if (state.teachers.length === 0 && !state.className) {
      state.className = "4° A";
      state.classType = "regular";
      state.teachers = [
        { id: uid(), name: "MARIANA", color: "#c6e0f5", subjects: ["POR","MAT","CIÊN"] },
        { id: uid(), name: "JOÃO", color: "#f8cbad", subjects: ["HIST","GEO","ED FÍS","CID","ART"] },
      ];
      save();
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    load();
    seedIfEmpty();
    $("#className").value = state.className || "";
    $("#classType").value = state.classType || "regular";
    bindUI();
    renderTeachers();
    renderGrid();
  });
  </script>
</body>
</html>
